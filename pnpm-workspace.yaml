packages:
  - 'artifacts'
# Let npm pack warn via devEngines while pnpm still selects the declared version.
pmOnFail: download
# Keep local resolutions aligned with pnpm's CI release-age policy.
minimumReleaseAge: 1440
# First official gateway SDK release; pin both reviewed artifacts without relaxing other dependencies.
minimumReleaseAgeExclude:
  - '@openclaw/gateway-client@2026.9.3'
  - '@openclaw/gateway-protocol@2026.9.3'
  # Reviewed GenUI releases replace the pinned previews before their 24-hour release-age cutoff.
  - 'partial-react@0.0.7'
  - 'partial-tsx@0.0.4'
  # Pi SDK 0.87.0 upgrades for issue #252 transcript context compatibility
  - '@earendil-works/chord@0.87.0'
  - '@earendil-works/pi-agent-core@0.87.0'
  - '@earendil-works/pi-ai@0.87.0'
  - '@earendil-works/pi-coding-agent@0.87.0'
  - '@earendil-works/pi-telemetry@0.87.0'
  - '@earendil-works/pi-tui@0.87.0'
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
